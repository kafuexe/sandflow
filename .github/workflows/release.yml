name: Release

# Push a tag like v0.2.0 (see README → Releasing). Builds installers for Windows, macOS and Linux,
# uploads them to a draft GitHub Release, and publishes it once every platform succeeded —
# installed apps then pick it up through auto-update.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "Sandflow $GITHUB_REF_NAME" --generate-notes

  build:
    needs: prepare
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:electron
      - name: Package and upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Builds are unsigned until signing secrets are configured (see README).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish always

  sandbox-image:
    needs: prepare
    name: Offline sandbox image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build sandflow-agent image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx build --platform "linux/${{ matrix.arch }}" --load -t "sandflow-agent:${VERSION}" sandbox
          docker run --rm --platform "linux/${{ matrix.arch }}" --entrypoint sh "sandflow-agent:${VERSION}" -c 'git --version && node --version'
      - name: Save as offline bundle and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="sandflow-sandbox-image-${VERSION}-linux-${{ matrix.arch }}.tar.gz"
          docker save "sandflow-agent:${VERSION}" | gzip -9 > "$FILE"
          sha256sum "$FILE" > "$FILE.sha256"
          gh release upload "$GITHUB_REF_NAME" "$FILE" "$FILE.sha256" --clobber

  publish:
    needs: [build, sandbox-image]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
