name: Release

# Push a tag like v0.2.0 (see README → Releasing). Builds the sandbox image once, packs it into one installer
# per OS (Windows .exe, Linux .deb + AppImage), uploads them to a draft GitHub Release, and publishes it once
# every platform succeeded — installed apps then pick it up through auto-update.
# Or run it from the Actions tab (Run workflow) with a tag like v0.2.0: the release then creates that tag on the
# commit it built once it's published.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.2.0 (must match package.json; created on the selected branch's commit)"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $PKG"
            exit 1
          fi
      - name: Plugin and marketplace versions must match package.json
        run: |
          node -e '
            const v = require("./package.json").version;
            const p = require("./claude-plugin/.claude-plugin/plugin.json").version;
            const m = require("./.claude-plugin/marketplace.json").plugins.find((x) => x.name === "sand").version;
            if (p !== v || m !== v) { console.error(`::error::plugin.json (${p}) and marketplace.json (${m}) must be ${v}`); process.exit(1); }
          '
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${RELEASE_TAG#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          cat > notes.md <<EOF
          ## Download

          | | |
          |---|---|
          | **Windows** (10/11, x64) | [Sandflow-Setup-${V}.exe](${URL}/Sandflow-Setup-${V}.exe) |
          | **Ubuntu / Debian** (x64) | [Sandflow-${V}-amd64.deb](${URL}/Sandflow-${V}-amd64.deb) — \`sudo apt install ./Sandflow-${V}-amd64.deb\` |
          | **Other Linux** (x64) | [Sandflow-${V}-x86_64.AppImage](${URL}/Sandflow-${V}-x86_64.AppImage) — \`chmod +x\` and run |

          Each installer is self-contained: the sandbox image is inside, so there's nothing else to download and it
          works offline. The other files here (\`latest*.yml\`, \`.blockmap\`) are used by auto-update.

          **npm** (needs Node.js 22+): \`npm install -g sandflow\`, then \`sandflow ui\` (and \`sandflow setup\` for Claude Code).

          **Command line + Claude Code plugin** (needs Node.js 22+): installs [sandflow-cli.tgz](${URL}/sandflow-cli.tgz)
          into \`~/.sandflow\` and adds \`/sand:flow\`, \`/sand:schedule\`, \`/sand:edit\` to Claude Code.

          - Windows: \`irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.ps1 | iex\`
          - Linux / macOS: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | bash\`

          EOF
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "Sandflow $RELEASE_TAG" --notes-file notes.md --generate-notes

  sandbox-image:
    needs: prepare
    name: Sandbox image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and save the sandflow-agent image
        run: node scripts/bundle-sandbox.mjs --platform linux/amd64
      - name: Smoke test the bundle (loads, runs as any UID)
        run: |
          IMAGE="sandflow-agent:${RELEASE_TAG#v}"
          docker image rm "$IMAGE"
          docker load -i build/sandbox/sandflow-agent.tar.gz
          docker run --rm --user 4242:4242 --entrypoint sh "$IMAGE" -c 'git --version && node --version && touch "$HOME/probe"'
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-image
          path: build/sandbox/sandflow-agent.tar.gz
          compression-level: 0 # already gzipped
          retention-days: 1

  build:
    needs: sandbox-image
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Packed into the installer as resources/sandbox/sandflow-agent.tar.gz (see electron-builder.yml).
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-image
          path: build/sandbox
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:electron
      - name: Package and upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Builds are unsigned until signing secrets are configured (see README).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish always

  cli:
    needs: prepare
    name: CLI package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:cli
      # release/sandflow-<version>.tgz (the `sandflow` npm package), attached as is and as sandflow-cli.tgz (what the
      # installers download).
      - run: npm run pack:cli
      - name: Name the tarball and write its checksum
        run: |
          V="${RELEASE_TAG#v}"
          cd release
          test -f "sandflow-${V}.tgz"
          cmp "sandflow-${V}.tgz" sandflow-cli.tgz
          sha256sum sandflow-cli.tgz > sandflow-cli.tgz.sha256
          cat sandflow-cli.tgz.sha256
      - name: Smoke test the installer with it
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          SANDFLOW_CLI_URL="$PWD/release/sandflow-cli.tgz" SANDFLOW_CLI_SHA256="$(cut -d' ' -f1 release/sandflow-cli.tgz.sha256)" \
            bash scripts/install.sh --no-plugin --no-mcp
          "$HOME/.sandflow/bin/sandflow" --version
      - name: Smoke test npm install -g with it
        run: |
          export HOME="$RUNNER_TEMP/npm-home"
          mkdir -p "$HOME"
          npm install -g --prefix "$RUNNER_TEMP/npm-global" "./release/sandflow-${RELEASE_TAG#v}.tgz"
          test "$("$RUNNER_TEMP/npm-global/bin/sandflow" --version)" = "${RELEASE_TAG#v}"
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" release/sandflow-cli.tgz release/sandflow-cli.tgz.sha256 "release/sandflow-${V}.tgz" --clobber

  # `npm i -g sandflow`: publishes the release's sandflow-<version>.tgz once every platform built. Needs an npm
  # automation token in the NPM_TOKEN repo secret; skipped (with a warning) without one.
  npm:
    needs: [build, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish sandflow to npm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V="${RELEASE_TAG#v}"
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::warning::NPM_TOKEN is not set; sandflow $V was not published to npm"; exit 0; fi
          if npm view "sandflow@$V" version >/dev/null 2>&1; then echo "sandflow@$V is already on npm"; exit 0; fi
          gh release download "$RELEASE_TAG" --pattern "sandflow-$V.tgz"
          npm publish "./sandflow-$V.tgz" --access public

  publish:
    needs: [build, cli]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
